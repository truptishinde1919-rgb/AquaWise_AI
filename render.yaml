services:
  - type: web
    name: aquawise-ai-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python ml/train.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
